name: CI/CD

on:
  pull_request:
  push:
    branches: [main]

# Superseded pull-request runs are cancelled. Runs on main are not: cancelling one
# mid-deploy leaves containers half-recreated, and the next deploy then fails.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Required check "backend" (branch ruleset, §10.1)
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: anecnotes_test
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci -d anecnotes_test"
          --health-interval 5s --health-retries 10
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: anecnotes_test
      DB_USERNAME: ci
      DB_PASSWORD: ci
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_pgsql, intl, zip
          coverage: none
      - uses: actions/cache@v4
        with:
          path: backend/vendor
          key: composer-${{ hashFiles('backend/composer.lock') }}
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env && php artisan key:generate
      - name: Lint (Pint)
        run: vendor/bin/pint --test
      - name: Static analysis (Larastan)
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G
      - name: Enable pg_trgm
        run: PGPASSWORD=ci psql -h 127.0.0.1 -U ci -d anecnotes_test -c "CREATE EXTENSION IF NOT EXISTS pg_trgm;"
      - name: Tests (Pest, against PostgreSQL)
        run: vendor/bin/pest

  # Required check "frontend"
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Lint
        run: flutter analyze
      - name: Tests
        run: flutter test

  # Automatic deployment on merge to main (DP3), on the self-hosted runner on the server
  # (a Windows laptop with Docker Desktop; see docs/deployment.md).
  # Runs only when the repository variable DEPLOY_ENABLED is 'true'.
  deploy:
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: [self-hosted, windows]
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    defaults:
      run:
        shell: powershell
    env:
      # Production .env lives only on the server, never in GitHub.
      ENV_FILE: ${{ vars.ENV_FILE || 'C:\anecnotes\prod.env' }}
      # quicktunnel (random URL) or tunnel (fixed domain with CLOUDFLARE_TUNNEL_TOKEN)
      COMPOSE_PROFILES: ${{ vars.TUNNEL_PROFILE || 'quicktunnel' }}
    steps:
      - uses: actions/checkout@v4
      - name: Copy the server's .env
        run: |
          if (-not (Test-Path $env:ENV_FILE)) { throw "Missing $env:ENV_FILE on the server" }
          Copy-Item $env:ENV_FILE .env -Force
      - name: Build and restart
        run: |
          $env:APP_VERSION = "${{ github.sha }}".Substring(0, 7)
          docker compose up -d --build --remove-orphans
          if ($LASTEXITCODE -ne 0) { throw "docker compose failed" }
      - name: Load demo accounts (sample data only, idempotent)
        run: |
          docker compose exec -T api php artisan db:seed --force
          if ($LASTEXITCODE -ne 0) { throw "seeding failed" }
      - name: Smoke test /api/health shows this commit
        run: |
          $sha = "${{ github.sha }}".Substring(0, 7)
          $port = (Select-String -Path .env -Pattern '^HTTP_PORT=(\d+)' | Select-Object -First 1).Matches.Groups[1].Value
          if (-not $port) { $port = '8080' }
          for ($i = 0; $i -lt 30; $i++) {
            try {
              $h = Invoke-RestMethod "http://localhost:$port/api/health" -TimeoutSec 5
              if ($h.commit -eq $sha -and $h.status -eq 'ok') { Write-Host "Healthy at $sha"; exit 0 }
            } catch {}
            Start-Sleep -Seconds 5
          }
          throw "Health check did not report $sha"
      - name: Show the public URL
        if: env.COMPOSE_PROFILES == 'quicktunnel'
        run: |
          $ErrorActionPreference = 'Continue'
          $url = docker compose logs quicktunnel | Select-String -Pattern 'https://[a-z0-9-]+\.trycloudflare\.com' -AllMatches |
            ForEach-Object { $_.Matches.Value } | Select-Object -Last 1
          Write-Host "Public URL: $url"
          "### Public URL`n$url" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
