openapi: 3.1.0
info:
  title: Anecnotes API
  version: 0.1.0-draft
  summary: Attendance and anecdotal records with AI-assisted repeated-behavior detection.
  description: |
    **Draft for M2 (design).** From M3 onward the live document at `/api/docs` is generated
    from the code by Scramble, and this file is re-exported from it.

    **Authentication:** Sanctum bearer tokens. Get one from `POST /api/v1/auth/login` and send
    `Authorization: Bearer <token>`. Every endpoint except `/api/health` and `/auth/login` requires it.

    **Roles:** each operation lists its allowed roles in `x-roles` and in its description.
    The server checks role and section ownership on every request; the client hides
    buttons only for convenience.

    **Offline sync:** records created on a phone carry a client-generated UUID `id`.
    Sending the same record twice updates it instead of creating a duplicate.

    **Errors** use one shape: `{ "message": "...", "errors": { "field": ["..."] } }`.
  contact:
    name: Ethan H. Campomanes (BSIT 4Cx)
  license:
    name: Proprietary (course project)
servers:
  - url: http://localhost:8080
    description: Local Docker Compose stack
security:
  - bearerAuth: []
tags:
  - name: System
  - name: Auth
  - name: Users
  - name: School setup
  - name: Students
  - name: Attendance
  - name: Anecdotes
  - name: Behavior flags
  - name: Statistics
  - name: Sync
  - name: Audit

paths:
  /api/health:
    get:
      tags: [System]
      operationId: health
      summary: Health check with deployed commit
      description: "Roles: public. Used by the deploy job and uptime checks."
      security: []
      x-roles: [public]
      responses:
        "200":
          description: API and database are up.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
              example: { status: ok, commit: 3f2a9c1, database: ok, time: "2026-11-23T09:57:42+00:00" }
        "503":
          description: Database is unreachable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
              example: { status: degraded, commit: 3f2a9c1, database: down, time: "2026-11-23T09:57:42+00:00" }

  # ---------------------------------------------------------------- Auth
  /api/v1/auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Sign in and get a token
      description: "Roles: public. Rate-limited to 5 attempts per minute per email and IP."
      security: []
      x-roles: [public]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, device_name]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
                device_name: { type: string, description: "Shown in the token list, e.g. 'Android - Redmi Note 12'" }
            example: { email: adviser@demo.anecnotes.test, password: "Demo-Passw0rd!", device_name: "Android - Redmi Note 12" }
      responses:
        "200":
          description: Signed in.
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  user: { $ref: "#/components/schemas/User" }
              example:
                token: "12|q8Zk3XsP9...redacted"
                user: { id: 2, name: Maria Santos, email: adviser@demo.anecnotes.test, role: teacher, is_active: true }
        "401": { $ref: "#/components/responses/InvalidCredentials" }
        "403": { $ref: "#/components/responses/AccountDisabled" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/v1/auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Revoke the current token
      description: "Roles: any signed-in user."
      x-roles: [admin, teacher, guidance]
      responses:
        "204": { description: Token revoked. }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /api/v1/auth/me:
    get:
      tags: [Auth]
      operationId: me
      summary: Current user and their sections
      description: "Roles: any signed-in user."
      x-roles: [admin, teacher, guidance]
      responses:
        "200":
          description: The signed-in user.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/User"
                  - type: object
                    properties:
                      advised_sections: { type: array, items: { $ref: "#/components/schemas/Section" } }
              example:
                id: 2
                name: Maria Santos
                email: adviser@demo.anecnotes.test
                role: teacher
                is_active: true
                advised_sections: [{ id: 5, school_year_id: 1, grade_level: 8, name: Rizal, adviser_id: 2, seat_rows: 6, seat_cols: 7 }]
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /api/v1/auth/password:
    put:
      tags: [Auth]
      operationId: changePassword
      summary: Change my password
      description: "Roles: any signed-in user. Signs out other sessions."
      x-roles: [admin, teacher, guidance]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, password, password_confirmation]
              properties:
                current_password: { type: string, format: password }
                password: { type: string, format: password, minLength: 10 }
                password_confirmation: { type: string, format: password }
            example: { current_password: "Demo-Passw0rd!", password: "N3w-Passw0rd-2026", password_confirmation: "N3w-Passw0rd-2026" }
      responses:
        "204": { description: Password changed. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "422": { $ref: "#/components/responses/ValidationError" }

  # ---------------------------------------------------------------- Users
  /api/v1/users:
    get:
      tags: [Users]
      operationId: listUsers
      summary: List staff accounts
      description: "Roles: admin."
      x-roles: [admin]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
        - $ref: "#/components/parameters/Search"
        - { name: role, in: query, schema: { $ref: "#/components/schemas/Role" } }
      responses:
        "200":
          description: A page of users.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserPage" }
              example:
                data: [{ id: 2, name: Maria Santos, email: adviser@demo.anecnotes.test, role: teacher, is_active: true }]
                meta: { current_page: 1, per_page: 20, total: 1, last_page: 1 }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Users]
      operationId: createUser
      summary: Create a staff account
      description: "Roles: admin. Audit-logged."
      x-roles: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserInput" }
            example: { name: Jose Reyes, email: guidance@demo.anecnotes.test, role: guidance, password: "Temp-Passw0rd-1" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
              example: { id: 3, name: Jose Reyes, email: guidance@demo.anecnotes.test, role: guidance, is_active: true }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /api/v1/users/{user}:
    parameters:
      - { name: user, in: path, required: true, schema: { type: integer } }
    patch:
      tags: [Users]
      operationId: updateUser
      summary: Update, lock or deactivate an account
      description: "Roles: admin. Locking or deactivating revokes the user's tokens. Audit-logged."
      x-roles: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                role: { $ref: "#/components/schemas/Role" }
                is_active: { type: boolean }
                locked_until: { type: [string, "null"], format: date-time }
            example: { is_active: false }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
              example: { id: 3, name: Jose Reyes, email: guidance@demo.anecnotes.test, role: guidance, is_active: false }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  # ---------------------------------------------------------------- School setup
  /api/v1/sections:
    get:
      tags: [School setup]
      operationId: listSections
      summary: List sections
      description: "Roles: admin and guidance see all; teachers see the sections they advise."
      x-roles: [admin, teacher, guidance]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
        - $ref: "#/components/parameters/Search"
        - { name: school_year_id, in: query, schema: { type: integer } }
        - { name: grade_level, in: query, schema: { type: integer, minimum: 7, maximum: 12 } }
        - { name: sort, in: query, schema: { type: string, enum: [name, -name, grade_level, -grade_level] } }
      responses:
        "200":
          description: A page of sections.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SectionPage" }
              example:
                data: [{ id: 5, school_year_id: 1, grade_level: 8, name: Rizal, adviser_id: 2, seat_rows: 6, seat_cols: 7 }]
                meta: { current_page: 1, per_page: 20, total: 1, last_page: 1 }
        "401": { $ref: "#/components/responses/Unauthenticated" }
    post:
      tags: [School setup]
      operationId: createSection
      summary: Create a section
      description: "Roles: admin."
      x-roles: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SectionInput" }
            example: { school_year_id: 1, grade_level: 8, name: Rizal, adviser_id: 2, seat_rows: 6, seat_cols: 7 }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Section" }
              example: { id: 5, school_year_id: 1, grade_level: 8, name: Rizal, adviser_id: 2, seat_rows: 6, seat_cols: 7 }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /api/v1/sections/{section}:
    parameters:
      - $ref: "#/components/parameters/SectionId"
    get:
      tags: [School setup]
      operationId: getSection
      summary: Get a section with its seat plan
      description: "Roles: admin, guidance, or the section's adviser."
      x-roles: [admin, teacher, guidance]
      responses:
        "200":
          description: The section and its enrolled students with seats.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Section"
                  - type: object
                    properties:
                      enrollments: { type: array, items: { $ref: "#/components/schemas/Enrollment" } }
              example:
                id: 5
                school_year_id: 1
                grade_level: 8
                name: Rizal
                adviser_id: 2
                seat_rows: 6
                seat_cols: 7
                enrollments: [{ id: 41, student: { id: 101, lrn: "123456789012", last_name: Dela Cruz, first_name: Juan, sex: M }, seat_row: 1, seat_col: 3, status: active }]
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [School setup]
      operationId: updateSection
      summary: Update a section
      description: "Roles: admin."
      x-roles: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SectionInput" }
            example: { adviser_id: 4 }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Section" }
              example: { id: 5, school_year_id: 1, grade_level: 8, name: Rizal, adviser_id: 4, seat_rows: 6, seat_cols: 7 }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [School setup]
      operationId: deleteSection
      summary: Delete a section (soft delete)
      description: "Roles: admin. Audit-logged."
      x-roles: [admin]
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/sections/{section}/seat-plan:
    parameters:
      - $ref: "#/components/parameters/SectionId"
    put:
      tags: [School setup]
      operationId: saveSeatPlan
      summary: Save the seat plan
      description: "Roles: admin or the section's adviser. Two students cannot share a seat."
      x-roles: [admin, teacher]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [seats]
              properties:
                seats:
                  type: array
                  items:
                    type: object
                    required: [enrollment_id]
                    properties:
                      enrollment_id: { type: integer }
                      seat_row: { type: [integer, "null"] }
                      seat_col: { type: [integer, "null"] }
            example: { seats: [{ enrollment_id: 41, seat_row: 1, seat_col: 3 }, { enrollment_id: 42, seat_row: 1, seat_col: 4 }] }
      responses:
        "204": { description: Saved. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /api/v1/sections/{section}/sf2:
    parameters:
      - $ref: "#/components/parameters/SectionId"
    get:
      tags: [Attendance]
      operationId: exportSf2
      summary: Export SF2 attendance for one month
      description: "Roles: admin or the section's adviser."
      x-roles: [admin, teacher]
      parameters:
        - { name: month, in: query, required: true, schema: { type: string, pattern: "^\\d{4}-\\d{2}$" }, example: "2026-11" }
      responses:
        "200":
          description: SF2 workbook.
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /api/v1/imports/sf1:
    post:
      tags: [School setup]
      operationId: previewSf1Import
      summary: Upload an SF1 file and preview the import
      description: "Roles: admin. Nothing is saved until the preview is confirmed."
      x-roles: [admin]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, school_year_id]
              properties:
                file: { type: string, format: binary, description: "SF1 .xlsx, max 10 MB" }
                school_year_id: { type: integer }
                adviser_id: { type: integer }
      responses:
        "200":
          description: Preview of the rows.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Sf1Preview" }
              example:
                import_id: 7f6c1a8e-2b1d-4c55-9a0e-1f2d3c4b5a69
                section: { grade_level: 8, name: Rizal }
                to_add: 38
                already_present: 2
                errors: [{ row: 17, message: "LRN must be 12 digits." }]
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /api/v1/imports/sf1/{import}/confirm:
    post:
      tags: [School setup]
      operationId: confirmSf1Import
      summary: Confirm a previewed SF1 import
      description: "Roles: admin. Runs in one transaction; re-running is safe (matched by LRN)."
      x-roles: [admin]
      parameters:
        - { name: import, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Imported.
          content:
            application/json:
              schema:
                type: object
                properties:
                  section_id: { type: integer }
                  students_created: { type: integer }
                  enrollments_created: { type: integer }
              example: { section_id: 5, students_created: 38, enrollments_created: 40 }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------------------------------------------------------------- Students
  /api/v1/students:
    get:
      tags: [Students]
      operationId: listStudents
      summary: Search students
      description: "Roles: admin, guidance, teacher (teachers may write anecdotes about any current student)."
      x-roles: [admin, teacher, guidance]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
        - $ref: "#/components/parameters/Search"
        - { name: section_id, in: query, schema: { type: integer } }
        - { name: sort, in: query, schema: { type: string, enum: [last_name, -last_name, lrn] } }
      responses:
        "200":
          description: A page of students.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StudentPage" }
              example:
                data: [{ id: 101, lrn: "123456789012", last_name: Dela Cruz, first_name: Juan, middle_name: Santos, sex: M, birthdate: "2012-04-09" }]
                meta: { current_page: 1, per_page: 20, total: 1, last_page: 1 }
        "401": { $ref: "#/components/responses/Unauthenticated" }
    post:
      tags: [Students]
      operationId: createStudent
      summary: Add a student
      description: "Roles: admin."
      x-roles: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StudentInput" }
            example: { lrn: "123456789013", last_name: Garcia, first_name: Ana, sex: F, birthdate: "2012-07-21", section_id: 5 }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Student" }
              example: { id: 102, lrn: "123456789013", last_name: Garcia, first_name: Ana, middle_name: null, sex: F, birthdate: "2012-07-21" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /api/v1/students/{student}:
    parameters:
      - $ref: "#/components/parameters/StudentId"
    get:
      tags: [Students]
      operationId: getStudent
      summary: Get a student
      description: "Roles: admin, teacher, guidance."
      x-roles: [admin, teacher, guidance]
      responses:
        "200":
          description: The student.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Student" }
              example: { id: 101, lrn: "123456789012", last_name: Dela Cruz, first_name: Juan, middle_name: Santos, sex: M, birthdate: "2012-04-09" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Students]
      operationId: updateStudent
      summary: Update a student or their enrollment status
      description: "Roles: admin. Audit-logged."
      x-roles: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StudentInput" }
            example: { middle_name: Reyes }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Student" }
              example: { id: 101, lrn: "123456789012", last_name: Dela Cruz, first_name: Juan, middle_name: Reyes, sex: M, birthdate: "2012-04-09" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [Students]
      operationId: deleteStudent
      summary: Delete a student (soft delete)
      description: "Roles: admin. History is kept. Audit-logged."
      x-roles: [admin]
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------------------------------------------------------------- Attendance
  /api/v1/attendance-sessions:
    get:
      tags: [Attendance]
      operationId: listAttendanceSessions
      summary: List roll calls for a section
      description: "Roles: admin, guidance, or the section's adviser."
      x-roles: [admin, teacher, guidance]
      parameters:
        - { name: section_id, in: query, required: true, schema: { type: integer } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - $ref: "#/components/parameters/Page"
      responses:
        "200":
          description: Sessions with their records.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/AttendanceSession" } }
                  meta: { $ref: "#/components/schemas/PageMeta" }
              example:
                data: [{ id: 0b8e7c56-1f0a-4b7e-a3b9-2c1d0e9f8a77, section_id: 5, session_date: "2026-11-23", period: am, device_started_at: "2026-11-23T07:31:05+08:00", server_received_at: "2026-11-23T07:31:07+08:00", edit_window_ends_at: "2026-11-23T07:46:05+08:00", clock_skew: false, records: [{ id: 5d1f0c3e-7a2b-4e6f-8c9d-0a1b2c3d4e5f, enrollment_id: 41, status: late }] }]
                meta: { current_page: 1, per_page: 20, total: 1, last_page: 1 }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Attendance]
      operationId: saveAttendanceSession
      summary: Save a roll call (create or edit within the window)
      description: |
        Roles: the section's adviser; admin at any time (reason required after the window).
        Idempotent on `id`. Edits by the adviser are accepted only while the device time is
        within 15 minutes of `device_started_at`; otherwise `403`.
      x-roles: [admin, teacher]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AttendanceSessionInput" }
            example:
              id: 0b8e7c56-1f0a-4b7e-a3b9-2c1d0e9f8a77
              section_id: 5
              session_date: "2026-11-23"
              period: am
              device_time: "2026-11-23T07:31:05+08:00"
              records: [{ id: 5d1f0c3e-7a2b-4e6f-8c9d-0a1b2c3d4e5f, enrollment_id: 41, status: late }]
      responses:
        "200":
          description: Existing session updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AttendanceSession" }
              example: { id: 0b8e7c56-1f0a-4b7e-a3b9-2c1d0e9f8a77, section_id: 5, session_date: "2026-11-23", period: am, device_started_at: "2026-11-23T07:31:05+08:00", server_received_at: "2026-11-23T07:31:07+08:00", edit_window_ends_at: "2026-11-23T07:46:05+08:00", clock_skew: false, records: [] }
        "201":
          description: Session created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AttendanceSession" }
              example: { id: 0b8e7c56-1f0a-4b7e-a3b9-2c1d0e9f8a77, section_id: 5, session_date: "2026-11-23", period: am, device_started_at: "2026-11-23T07:31:05+08:00", server_received_at: "2026-11-23T07:31:07+08:00", edit_window_ends_at: "2026-11-23T07:46:05+08:00", clock_skew: false, records: [] }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: Not the adviser, or the 15-minute window has closed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { message: "The 15-minute correction window has closed. Ask an admin to change this record." }
        "422": { $ref: "#/components/responses/ValidationError" }

  # ---------------------------------------------------------------- Anecdotes
  /api/v1/anecdotes:
    get:
      tags: [Anecdotes]
      operationId: listAnecdotes
      summary: List anecdotes
      description: "Roles: admin and guidance see all; teachers see their own and those about students in sections they advise."
      x-roles: [admin, teacher, guidance]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
        - $ref: "#/components/parameters/Search"
        - { name: student_id, in: query, schema: { type: integer } }
        - { name: section_id, in: query, schema: { type: integer } }
        - { name: category, in: query, schema: { $ref: "#/components/schemas/Category" } }
        - { name: status, in: query, schema: { type: string, enum: [open, resolved] } }
        - { name: sort, in: query, schema: { type: string, enum: [occurred_at, -occurred_at], default: -occurred_at } }
      responses:
        "200":
          description: A page of anecdotes.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnecdotePage" }
              example:
                data: [{ id: 9a7c2e11-4b3d-4f8a-9e6b-1c2d3e4f5a6b, student_id: 101, author_id: 2, occurred_at: "2026-11-23T10:15:00+08:00", location: Canteen, description: "Pushed a classmate during recess and called him names.", action_taken: "Talked to both students.", status: open, analysis: { status: done, category: aggression_bullying, severity: medium, confidence: 0.82, label: AI suggestion } }]
                meta: { current_page: 1, per_page: 20, total: 1, last_page: 1 }
        "401": { $ref: "#/components/responses/Unauthenticated" }
    post:
      tags: [Anecdotes]
      operationId: createAnecdote
      summary: Write an anecdote
      description: |
        Roles: teacher, guidance, admin. Idempotent on `id` (client-generated UUID).
        Returns at once; AI analysis runs in the background (`analysis.status: pending`).
      x-roles: [admin, teacher, guidance]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AnecdoteInput" }
            example:
              id: 9a7c2e11-4b3d-4f8a-9e6b-1c2d3e4f5a6b
              student_id: 101
              occurred_at: "2026-11-23T10:15:00+08:00"
              location: Canteen
              description: "Pushed a classmate during recess and called him names."
              action_taken: "Talked to both students."
              device_time: "2026-11-23T10:17:42+08:00"
      responses:
        "200":
          description: Already received (same `id`); current state returned.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Anecdote" }
              example: { id: 9a7c2e11-4b3d-4f8a-9e6b-1c2d3e4f5a6b, student_id: 101, author_id: 2, occurred_at: "2026-11-23T10:15:00+08:00", location: Canteen, description: "Pushed a classmate during recess and called him names.", action_taken: "Talked to both students.", status: open, analysis: { status: done, category: aggression_bullying, severity: medium, confidence: 0.82, label: AI suggestion } }
        "201":
          description: Created; analysis pending.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Anecdote" }
              example: { id: 9a7c2e11-4b3d-4f8a-9e6b-1c2d3e4f5a6b, student_id: 101, author_id: 2, occurred_at: "2026-11-23T10:15:00+08:00", location: Canteen, description: "Pushed a classmate during recess and called him names.", action_taken: "Talked to both students.", status: open, analysis: { status: pending } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /api/v1/anecdotes/{anecdote}:
    parameters:
      - $ref: "#/components/parameters/AnecdoteId"
    get:
      tags: [Anecdotes]
      operationId: getAnecdote
      summary: Get an anecdote
      description: "Roles: admin, guidance, the author, or the student's adviser."
      x-roles: [admin, teacher, guidance]
      responses:
        "200":
          description: The anecdote.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Anecdote" }
              example: { id: 9a7c2e11-4b3d-4f8a-9e6b-1c2d3e4f5a6b, student_id: 101, author_id: 2, occurred_at: "2026-11-23T10:15:00+08:00", location: Canteen, description: "Pushed a classmate during recess and called him names.", action_taken: "Talked to both students.", status: open, analysis: { status: done, category: aggression_bullying, severity: medium, confidence: 0.82, label: AI suggestion } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Anecdotes]
      operationId: updateAnecdote
      summary: Edit an anecdote or override the AI category
      description: |
        Roles: the author (text, until resolved); guidance and admin (category and severity overrides).
        Changing `description` queues a new analysis. Audit-logged.
      x-roles: [admin, teacher, guidance]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                description: { type: string, minLength: 10, maxLength: 5000 }
                location: { type: [string, "null"] }
                action_taken: { type: [string, "null"] }
                category_override: { oneOf: [{ $ref: "#/components/schemas/Category" }, { type: "null" }] }
                severity_override: { oneOf: [{ $ref: "#/components/schemas/Severity" }, { type: "null" }] }
            example: { category_override: defiance_disrespect }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Anecdote" }
              example: { id: 9a7c2e11-4b3d-4f8a-9e6b-1c2d3e4f5a6b, student_id: 101, author_id: 2, occurred_at: "2026-11-23T10:15:00+08:00", location: Canteen, description: "Pushed a classmate during recess and called him names.", action_taken: "Talked to both students.", status: open, category_override: defiance_disrespect, analysis: { status: done, category: aggression_bullying, severity: medium, confidence: 0.82, label: AI suggestion } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [Anecdotes]
      operationId: deleteAnecdote
      summary: Delete an anecdote (soft delete)
      description: "Roles: the author (while open) or admin. Audit-logged."
      x-roles: [admin, teacher]
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/anecdotes/{anecdote}/resolve:
    parameters:
      - $ref: "#/components/parameters/AnecdoteId"
    post:
      tags: [Anecdotes]
      operationId: resolveAnecdote
      summary: Resolve an anecdote
      description: "Roles: guidance. Audit-logged."
      x-roles: [guidance]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resolution_note]
              properties:
                resolution_note: { type: string, minLength: 5 }
            example: { resolution_note: "Met the student and parent on 2026-11-25; agreed on a behavior plan." }
      responses:
        "200":
          description: Resolved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Anecdote" }
              example: { id: 9a7c2e11-4b3d-4f8a-9e6b-1c2d3e4f5a6b, student_id: 101, author_id: 2, occurred_at: "2026-11-23T10:15:00+08:00", location: Canteen, description: "Pushed a classmate during recess and called him names.", action_taken: "Talked to both students.", status: resolved, resolved_by: 3, resolved_at: "2026-11-25T14:02:00+08:00", resolution_note: "Met the student and parent on 2026-11-25; agreed on a behavior plan.", analysis: { status: done, category: aggression_bullying, severity: medium, confidence: 0.82, label: AI suggestion } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /api/v1/anecdotes/{anecdote}/analysis:
    parameters:
      - $ref: "#/components/parameters/AnecdoteId"
    get:
      tags: [Anecdotes]
      operationId: getAnecdoteAnalysis
      summary: AI analysis of an anecdote (current and history)
      description: "Roles: same as reading the anecdote. Output is labeled AI-generated."
      x-roles: [admin, teacher, guidance]
      responses:
        "200":
          description: Current analysis and earlier runs.
          content:
            application/json:
              schema:
                type: object
                properties:
                  current: { $ref: "#/components/schemas/AiAnalysis" }
                  history: { type: array, items: { $ref: "#/components/schemas/AiAnalysis" } }
              example:
                current: { id: 311, kind: classification, provider: groq, model: llama-3.1-8b-instant, outcome: ok, category: aggression_bullying, severity: medium, confidence: 0.82, output: "[STUDENT] pushed a classmate and called him names during recess.", latency_ms: 640, created_at: "2026-11-23T10:18:01+08:00", label: AI suggestion }
                history: []
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------------------------------------------------------------- Flags
  /api/v1/behavior-flags:
    get:
      tags: [Behavior flags]
      operationId: listBehaviorFlags
      summary: List repeated-behavior flags
      description: "Roles: guidance and admin."
      x-roles: [admin, guidance]
      parameters:
        - $ref: "#/components/parameters/Page"
        - { name: status, in: query, schema: { type: string, enum: [pending, confirmed, dismissed] } }
        - { name: section_id, in: query, schema: { type: integer } }
        - { name: category, in: query, schema: { $ref: "#/components/schemas/Category" } }
      responses:
        "200":
          description: A page of flags, newest first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/BehaviorFlag" } }
                  meta: { $ref: "#/components/schemas/PageMeta" }
              example:
                data: [{ id: 12, student: { id: 101, last_name: Dela Cruz, first_name: Juan }, category: aggression_bullying, trigger: count_rule, anecdote_count: 3, window_start: "2026-10-27", window_end: "2026-11-25", status: pending }]
                meta: { current_page: 1, per_page: 20, total: 1, last_page: 1 }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/behavior-flags/{flag}:
    parameters:
      - { name: flag, in: path, required: true, schema: { type: integer } }
    get:
      tags: [Behavior flags]
      operationId: getBehaviorFlag
      summary: Get a flag with its anecdotes and AI summary
      description: "Roles: guidance and admin."
      x-roles: [admin, guidance]
      responses:
        "200":
          description: The flag.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/BehaviorFlag"
                  - type: object
                    properties:
                      anecdote_ids: { type: array, items: { type: string, format: uuid } }
                      summary: { $ref: "#/components/schemas/AiAnalysis" }
              example:
                id: 12
                student: { id: 101, last_name: Dela Cruz, first_name: Juan }
                category: aggression_bullying
                trigger: count_rule
                anecdote_count: 3
                window_start: "2026-10-27"
                window_end: "2026-11-25"
                status: pending
                anecdote_ids: [9a7c2e11-4b3d-4f8a-9e6b-1c2d3e4f5a6b]
                summary: { id: 340, kind: summary, provider: groq, model: llama-3.1-8b-instant, outcome: ok, output: "Three incidents of physical aggression toward classmates in four weeks, mostly at recess.", latency_ms: 910, created_at: "2026-11-25T08:00:12+08:00", label: AI-generated - verify against the records }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Behavior flags]
      operationId: reviewBehaviorFlag
      summary: Confirm or dismiss a flag
      description: "Roles: guidance. A note is required. Audit-logged. The system takes no action by itself."
      x-roles: [guidance]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status, review_note]
              properties:
                status: { type: string, enum: [confirmed, dismissed] }
                review_note: { type: string, minLength: 5 }
            example: { status: confirmed, review_note: "Scheduled counseling for 2026-11-26." }
      responses:
        "200":
          description: Reviewed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BehaviorFlag" }
              example: { id: 12, student: { id: 101, last_name: Dela Cruz, first_name: Juan }, category: aggression_bullying, trigger: count_rule, anecdote_count: 3, window_start: "2026-10-27", window_end: "2026-11-25", status: confirmed }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  # ---------------------------------------------------------------- Statistics
  /api/v1/statistics:
    get:
      tags: [Statistics]
      operationId: statistics
      summary: Attendance and anecdote statistics
      description: "Roles: admin and guidance (all sections); teachers (sections they advise)."
      x-roles: [admin, teacher, guidance]
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: section_id, in: query, schema: { type: integer } }
      responses:
        "200":
          description: Aggregates.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Statistics" }
              example:
                attendance_rate: [{ section_id: 5, month: "2026-11", rate: 0.94 }]
                anecdotes_by_category: [{ category: aggression_bullying, month: "2026-11", count: 7 }]
                flags: { pending: 2, confirmed: 5, dismissed: 1 }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ---------------------------------------------------------------- Sync
  /api/v1/sync/changes:
    get:
      tags: [Sync]
      operationId: pullChanges
      summary: Pull changes since the last sync
      description: |
        Roles: teacher (only their sections and own anecdotes), guidance, admin.
        Returns records changed after `since` plus a new cursor. Small pages keep mobile data low.
      x-roles: [admin, teacher, guidance]
      parameters:
        - { name: since, in: query, schema: { type: string }, description: "Cursor from the previous pull; omit for a first sync." }
        - { name: limit, in: query, schema: { type: integer, default: 200, maximum: 500 } }
      responses:
        "200":
          description: Changes.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SyncPull" }
              example:
                cursor: "2026-11-23T10:20:00.123456Z"
                has_more: false
                sections: []
                enrollments: []
                students: []
                anecdotes: [{ id: 9a7c2e11-4b3d-4f8a-9e6b-1c2d3e4f5a6b, student_id: 101, author_id: 2, occurred_at: "2026-11-23T10:15:00+08:00", description: "Pushed a classmate during recess and called him names.", status: open, analysis: { status: done, category: aggression_bullying, severity: medium, confidence: 0.82, label: AI suggestion } }]
                attendance_sessions: []
                deleted: [{ type: anecdote, id: 1c2b3a49-5e6f-4a7b-8c9d-0e1f2a3b4c5d }]
        "401": { $ref: "#/components/responses/Unauthenticated" }
    post:
      tags: [Sync]
      operationId: pushChanges
      summary: Push queued offline changes
      description: |
        Roles: teacher, guidance, admin. Each item is applied on its own; one rejected item
        does not block the rest. Items are idempotent on their `id`.
      x-roles: [admin, teacher, guidance]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SyncPush" }
            example:
              device_time: "2026-11-23T15:02:11+08:00"
              anecdotes: [{ id: 9a7c2e11-4b3d-4f8a-9e6b-1c2d3e4f5a6b, student_id: 101, occurred_at: "2026-11-23T10:15:00+08:00", description: "Pushed a classmate during recess and called him names.", device_time: "2026-11-23T10:17:42+08:00" }]
              attendance_sessions: []
      responses:
        "200":
          description: Per-item results.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SyncResult" }
              example:
                results:
                  - { type: anecdote, id: 9a7c2e11-4b3d-4f8a-9e6b-1c2d3e4f5a6b, status: created }
                  - { type: attendance_session, id: 0b8e7c56-1f0a-4b7e-a3b9-2c1d0e9f8a77, status: rejected, message: "The 15-minute correction window has closed." }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "413":
          description: Batch too large (more than 500 items).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { message: "Send at most 500 items per request." }
        "422": { $ref: "#/components/responses/ValidationError" }

  # ---------------------------------------------------------------- Audit
  /api/v1/audit-logs:
    get:
      tags: [Audit]
      operationId: listAuditLogs
      summary: Read the audit log
      description: "Roles: admin. Read-only."
      x-roles: [admin]
      parameters:
        - $ref: "#/components/parameters/Page"
        - { name: user_id, in: query, schema: { type: integer } }
        - { name: action, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
      responses:
        "200":
          description: A page of entries, newest first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/AuditLog" } }
                  meta: { $ref: "#/components/schemas/PageMeta" }
              example:
                data: [{ id: 901, user_id: 3, action: flag_reviewed, auditable_type: behavior_flag, auditable_id: "12", old_values: { status: pending }, new_values: { status: confirmed }, ip_address: 172.18.0.1, created_at: "2026-11-25T08:30:00+08:00" }]
                meta: { current_page: 1, per_page: 20, total: 1, last_page: 1 }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/ai/usage:
    get:
      tags: [Audit]
      operationId: aiUsage
      summary: AI usage, failures and latency per day
      description: "Roles: admin."
      x-roles: [admin]
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
      responses:
        "200":
          description: Daily totals.
          content:
            application/json:
              schema:
                type: object
                properties:
                  days:
                    type: array
                    items:
                      type: object
                      properties:
                        date: { type: string, format: date }
                        calls: { type: integer }
                        fallback_used: { type: integer }
                        failed: { type: integer }
                        mean_latency_ms: { type: integer }
              example: { days: [{ date: "2026-11-23", calls: 42, fallback_used: 1, failed: 0, mean_latency_ms: 710 }] }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Laravel Sanctum personal access token.

  parameters:
    Page: { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
    PerPage: { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
    Search: { name: q, in: query, schema: { type: string }, description: "Search by name (or LRN for students)." }
    SectionId: { name: section, in: path, required: true, schema: { type: integer } }
    StudentId: { name: student, in: path, required: true, schema: { type: integer } }
    AnecdoteId: { name: anecdote, in: path, required: true, schema: { type: string, format: uuid } }

  responses:
    Unauthenticated:
      description: Missing, expired or revoked token.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { message: Unauthenticated. }
    InvalidCredentials:
      description: Wrong email or password.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { message: These credentials do not match our records. }
    AccountDisabled:
      description: The account is locked or deactivated.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { message: This account is disabled. Contact the administrator. }
    Forbidden:
      description: The role or section check failed.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { message: This action is unauthorized. }
    NotFound:
      description: No such record (or soft-deleted).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { message: Record not found. }
    ValidationError:
      description: Invalid input.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { message: The description field must be at least 10 characters., errors: { description: [The description field must be at least 10 characters.] } }
    TooManyRequests:
      description: Rate limit reached.
      headers:
        Retry-After: { schema: { type: integer }, description: Seconds to wait. }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { message: Too many login attempts. Please try again in 60 seconds. }

  schemas:
    Error:
      type: object
      required: [message]
      properties:
        message: { type: string }
        errors: { type: object, additionalProperties: { type: array, items: { type: string } } }
    Health:
      type: object
      properties:
        status: { type: string, enum: [ok, degraded] }
        commit: { type: string, description: Short git SHA of the deployed build }
        database: { type: string, enum: [ok, down] }
        time: { type: string, format: date-time }
    PageMeta:
      type: object
      properties:
        current_page: { type: integer }
        per_page: { type: integer }
        total: { type: integer }
        last_page: { type: integer }

    Role: { type: string, enum: [admin, teacher, guidance] }
    Category:
      type: string
      enum: [attendance_tardiness, disruptive_behavior, defiance_disrespect, aggression_bullying, academic_concern, wellbeing_concern, positive_behavior, other]
    Severity: { type: string, enum: [low, medium, high] }

    User:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string, format: email }
        role: { $ref: "#/components/schemas/Role" }
        is_active: { type: boolean }
        locked_until: { type: [string, "null"], format: date-time }
    UserInput:
      type: object
      required: [name, email, role, password]
      properties:
        name: { type: string, maxLength: 120 }
        email: { type: string, format: email }
        role: { $ref: "#/components/schemas/Role" }
        password: { type: string, format: password, minLength: 10 }
    UserPage:
      type: object
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/User" } }
        meta: { $ref: "#/components/schemas/PageMeta" }

    Section:
      type: object
      properties:
        id: { type: integer }
        school_year_id: { type: integer }
        grade_level: { type: integer, minimum: 7, maximum: 12 }
        name: { type: string }
        adviser_id: { type: [integer, "null"] }
        seat_rows: { type: integer }
        seat_cols: { type: integer }
    SectionInput:
      type: object
      properties:
        school_year_id: { type: integer }
        grade_level: { type: integer, minimum: 7, maximum: 12 }
        name: { type: string, maxLength: 60 }
        adviser_id: { type: [integer, "null"] }
        seat_rows: { type: integer, minimum: 1, maximum: 12 }
        seat_cols: { type: integer, minimum: 1, maximum: 12 }
    SectionPage:
      type: object
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/Section" } }
        meta: { $ref: "#/components/schemas/PageMeta" }

    Student:
      type: object
      properties:
        id: { type: integer }
        lrn: { type: string, pattern: "^\\d{12}$" }
        last_name: { type: string }
        first_name: { type: string }
        middle_name: { type: [string, "null"] }
        sex: { type: string, enum: [M, F] }
        birthdate: { type: string, format: date }
    StudentInput:
      type: object
      properties:
        lrn: { type: string, pattern: "^\\d{12}$" }
        last_name: { type: string }
        first_name: { type: string }
        middle_name: { type: [string, "null"] }
        sex: { type: string, enum: [M, F] }
        birthdate: { type: string, format: date }
        section_id: { type: integer, description: Creates an active enrollment }
        enrollment_status: { type: string, enum: [active, transferred, dropped] }
    StudentPage:
      type: object
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/Student" } }
        meta: { $ref: "#/components/schemas/PageMeta" }
    Enrollment:
      type: object
      properties:
        id: { type: integer }
        student: { $ref: "#/components/schemas/Student" }
        seat_row: { type: [integer, "null"] }
        seat_col: { type: [integer, "null"] }
        status: { type: string, enum: [active, transferred, dropped] }

    Sf1Preview:
      type: object
      properties:
        import_id: { type: string, format: uuid }
        section: { type: object, properties: { grade_level: { type: integer }, name: { type: string } } }
        to_add: { type: integer }
        already_present: { type: integer }
        errors:
          type: array
          items: { type: object, properties: { row: { type: integer }, message: { type: string } } }

    AttendanceStatus: { type: string, enum: [present, absent, late, excused] }
    AttendanceRecordInput:
      type: object
      required: [id, enrollment_id, status]
      properties:
        id: { type: string, format: uuid }
        enrollment_id: { type: integer }
        status: { $ref: "#/components/schemas/AttendanceStatus" }
    AttendanceSessionInput:
      type: object
      required: [id, section_id, session_date, period, device_time, records]
      properties:
        id: { type: string, format: uuid }
        section_id: { type: integer }
        session_date: { type: string, format: date }
        period: { type: string, enum: [am, pm, whole_day] }
        device_time: { type: string, format: date-time, description: Phone clock at the moment of this save }
        reason: { type: string, description: Required for admin edits after the window }
        records: { type: array, items: { $ref: "#/components/schemas/AttendanceRecordInput" } }
    AttendanceSession:
      type: object
      properties:
        id: { type: string, format: uuid }
        section_id: { type: integer }
        session_date: { type: string, format: date }
        period: { type: string, enum: [am, pm, whole_day] }
        device_started_at: { type: string, format: date-time }
        server_received_at: { type: string, format: date-time }
        edit_window_ends_at: { type: string, format: date-time }
        clock_skew: { type: boolean }
        records: { type: array, items: { $ref: "#/components/schemas/AttendanceRecordInput" } }

    AnalysisSummary:
      type: object
      description: Short form of the current AI analysis, shown with the label.
      properties:
        status: { type: string, enum: [pending, done, failed, disabled] }
        category: { $ref: "#/components/schemas/Category" }
        severity: { $ref: "#/components/schemas/Severity" }
        confidence: { type: number, minimum: 0, maximum: 1 }
        label: { type: string, example: AI suggestion }
    AnecdoteInput:
      type: object
      required: [id, student_id, occurred_at, description, device_time]
      properties:
        id: { type: string, format: uuid, description: Client-generated; makes the request idempotent }
        student_id: { type: integer }
        occurred_at: { type: string, format: date-time }
        location: { type: [string, "null"], maxLength: 120 }
        description: { type: string, minLength: 10, maxLength: 5000 }
        action_taken: { type: [string, "null"] }
        device_time: { type: string, format: date-time }
    Anecdote:
      type: object
      properties:
        id: { type: string, format: uuid }
        student_id: { type: integer }
        author_id: { type: integer }
        occurred_at: { type: string, format: date-time }
        location: { type: [string, "null"] }
        description: { type: string }
        action_taken: { type: [string, "null"] }
        category_override: { oneOf: [{ $ref: "#/components/schemas/Category" }, { type: "null" }] }
        severity_override: { oneOf: [{ $ref: "#/components/schemas/Severity" }, { type: "null" }] }
        status: { type: string, enum: [open, resolved] }
        resolved_by: { type: [integer, "null"] }
        resolved_at: { type: [string, "null"], format: date-time }
        resolution_note: { type: [string, "null"] }
        analysis: { $ref: "#/components/schemas/AnalysisSummary" }
    AnecdotePage:
      type: object
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/Anecdote" } }
        meta: { $ref: "#/components/schemas/PageMeta" }
    AiAnalysis:
      type: object
      properties:
        id: { type: integer }
        kind: { type: string, enum: [classification, summary] }
        provider: { type: string, enum: [groq, openrouter, local] }
        model: { type: string }
        outcome: { type: string, enum: [ok, fallback_used, failed] }
        category: { $ref: "#/components/schemas/Category" }
        severity: { $ref: "#/components/schemas/Severity" }
        confidence: { type: number }
        output: { type: string }
        latency_ms: { type: integer }
        created_at: { type: string, format: date-time }
        label: { type: string }

    BehaviorFlag:
      type: object
      properties:
        id: { type: integer }
        student: { type: object, properties: { id: { type: integer }, last_name: { type: string }, first_name: { type: string } } }
        category: { $ref: "#/components/schemas/Category" }
        trigger: { type: string, enum: [count_rule, similar_wording, high_severity] }
        anecdote_count: { type: integer }
        window_start: { type: string, format: date }
        window_end: { type: string, format: date }
        status: { type: string, enum: [pending, confirmed, dismissed] }
        reviewed_by: { type: [integer, "null"] }
        reviewed_at: { type: [string, "null"], format: date-time }
        review_note: { type: [string, "null"] }

    Statistics:
      type: object
      properties:
        attendance_rate:
          type: array
          items: { type: object, properties: { section_id: { type: integer }, month: { type: string }, rate: { type: number } } }
        anecdotes_by_category:
          type: array
          items: { type: object, properties: { category: { $ref: "#/components/schemas/Category" }, month: { type: string }, count: { type: integer } } }
        flags:
          type: object
          properties: { pending: { type: integer }, confirmed: { type: integer }, dismissed: { type: integer } }

    SyncPull:
      type: object
      properties:
        cursor: { type: string }
        has_more: { type: boolean }
        sections: { type: array, items: { $ref: "#/components/schemas/Section" } }
        enrollments: { type: array, items: { $ref: "#/components/schemas/Enrollment" } }
        students: { type: array, items: { $ref: "#/components/schemas/Student" } }
        anecdotes: { type: array, items: { $ref: "#/components/schemas/Anecdote" } }
        attendance_sessions: { type: array, items: { $ref: "#/components/schemas/AttendanceSession" } }
        deleted:
          type: array
          items: { type: object, properties: { type: { type: string }, id: { type: string } } }
    SyncPush:
      type: object
      required: [device_time]
      properties:
        device_time: { type: string, format: date-time }
        anecdotes: { type: array, maxItems: 500, items: { $ref: "#/components/schemas/AnecdoteInput" } }
        attendance_sessions: { type: array, maxItems: 500, items: { $ref: "#/components/schemas/AttendanceSessionInput" } }
    SyncResult:
      type: object
      properties:
        results:
          type: array
          items:
            type: object
            properties:
              type: { type: string, enum: [anecdote, attendance_session] }
              id: { type: string, format: uuid }
              status: { type: string, enum: [created, updated, unchanged, rejected] }
              message: { type: string }

    AuditLog:
      type: object
      properties:
        id: { type: integer }
        user_id: { type: [integer, "null"] }
        action: { type: string }
        auditable_type: { type: string }
        auditable_id: { type: string }
        old_values: { type: [object, "null"] }
        new_values: { type: [object, "null"] }
        ip_address: { type: string }
        created_at: { type: string, format: date-time }
